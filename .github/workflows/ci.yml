name: CI Pipeline

# When this workflow runs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# What jobs to execute
jobs:
  test:
    name: Run cart tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Display Node.js version
        run: node --version
      
      - name: Run cart tests
        run: node cart.test.js
      
      - name: Tests passed!
        run: echo "✅ All cart tests passed successfully"