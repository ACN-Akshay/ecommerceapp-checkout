name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]   # triggers after PR merge to main

permissions:
  id-token: write        # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci             # cleaner than npm install for CI/CD

      - name: Run tests
        run: npm test           # gate: deploy only if tests pass

      - name: Azure Login (OIDC — no secrets!)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ecommerceapp-checkout-akshay
          package: .